[package]
name = "repliplatform-client-http"
version = "0.1.0"

edition = "2021"
rust-version = "1.78"

description = "HTTP implementation of the Replicante Platform API client"
homepage = "https://www.replicante.io/"
license = "MIT"

[dependencies]
anyhow = "^1.0"
async-trait = "^0.1"
reqwest = { version = "^0.12", features = ["deflate", "gzip", "json", "zstd"] }
serde = "^1.0"
serde_json = "^1.0"
thiserror = "^2.0"

replisdk = { version = "^0.1", features = [
  "platform-models",
  "utils-error_json",
] }

repliplatform-client = { path = "../" }
repliclient-utils = { path = "../../utils" }
