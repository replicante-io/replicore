[package]
name = "replicore-coordinator-sqlite"
version = "0.1.0"

edition = "2021"
rust-version = "1.78"

description = "RepliCore distributed coordination backed by an SQLite DB"
homepage = "https://www.replicante.io/"
license = "MIT"

[dependencies]
anyhow = "^1.0"
async-trait = "^0.1"
once_cell = "^1.18"
opentelemetry = "^0.27"
prometheus = "^0.13"
refinery = { version = "^0.8", features = ["rusqlite"] }
rusqlite = { version = "^0.31", features = ["bundled"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
slog = "^2.0"
thiserror = "^2.0"
time = { version = "^0.3", features = ["formatting"] }
tokio = { version = "^1.0", features = ["time"] }
tokio-rusqlite = "^0.5"
uuid = { version = "^1.4", features = ["v4"] }

replicore-context = { path = "../../context" }
replicore-coordinator = { path = "../" }

replisdk = { version = "^0.1", features = [
  #"replicore-models",
  #"utils-encoding",
  "utils-metrics",
  "utils-trace",
] }

[dev-dependencies]
tokio = { version = "^1.0", features = ["macros", "rt"] }

replicore-context = { path = "../../context", features = ["test-fixture"] }
